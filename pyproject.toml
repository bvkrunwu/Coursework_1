[project]
name = "coursework-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexey Serdiuk",email = "ytfrpkkpreim@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "pandas-stubs (==2.3.2.250926)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.9.0"
mypy = "^1.18.2"
isort = "^7.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"


[tool.black]
line-length = 119
exclude = ".git"


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'


[tool.isort]
line_length = 119